# Continuous Deployment to GitHub Pages
name: 'CD: Deploy to GitHub Pages'

on:
  # Runs on pushes targeting the default branch
  push:
    branches:
      - master

  # Daily rebuild refreshes the homepage's live threat stats (NVD + CISA KEV)
  schedule:
    - cron: "17 13 * * *"

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.160.1
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb          
      - name: Install Dart Sass
        run: sudo snap install dart-sass
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Install Node.js dependencies
        run: npm ci
      - name: Fix code style with Prettier
        run: npm run format
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          TZ: America/Los_Angeles
          # Optional: raises NVD API rate limits for the homepage stats
          HUGO_NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        # baseURL comes from hugo.toml (https://www.cybersecurityos.net/).
        # Don't pass --baseURL from configure-pages: it reports http:// for the
        # custom domain, which put http:// in the sitemap, canonical tags, RSS
        # and og:url.
        run: hugo --gc --minify
      - name: Index site with Pagefind
        run: npx pagefind --source public
      # Package and upload by hand instead of actions/upload-pages-artifact@v4,
      # which excludes dot-directories and so dropped /.well-known/security.txt.
      # This is the same tarball that action builds, minus that exclusion.
      - name: Package site
        run: |
          tar --dereference --hard-dereference --directory public \
            -cvf "$RUNNER_TEMP/artifact.tar" \
            --exclude=.git --exclude=.github .
          tar -tf "$RUNNER_TEMP/artifact.tar" | grep -q '^\./\.well-known/security\.txt$' \
            || echo "::warning::.well-known/security.txt is missing from the Pages artifact"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5