<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050c1a"/>
      <stop offset="100%" stop-color="#0c1f3a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0e2440" stroke-width="0.7"/>
    </pattern>
  </defs>

  <rect width="800" height="420" fill="url(#bg)"/>
  <rect width="800" height="420" fill="url(#grid)"/>

  <!-- Top accent — red -->
  <rect x="0" y="0" width="800" height="4" fill="#ef4444"/>

  <!-- Left bar -->
  <rect x="52" y="56" width="4" height="262" rx="2" fill="#ef4444"/>

  <!-- Category chip -->
  <rect x="72" y="56" width="158" height="22" rx="11" fill="#1a0a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="151" y="71" text-anchor="middle" font-size="9" fill="#ef4444" letter-spacing="1.5" font-weight="600">SUPPLY CHAIN ATTACK</text>
  <text x="240" y="71" font-size="9.5" fill="#3d6b8c" letter-spacing="1">AUG 4, 2026</text>

  <!-- Title -->
  <text x="72" y="128" font-size="26" font-weight="800" fill="#e8f4ff" letter-spacing="-0.5">The keyv Worm Made</text>
  <text x="72" y="166" font-size="26" font-weight="800" fill="#e8f4ff" letter-spacing="-0.5">Rotating Your Tokens</text>
  <text x="72" y="204" font-size="26" font-weight="800" fill="#ef4444" letter-spacing="-0.5">The Trigger.</text>

  <!-- Divider -->
  <rect x="72" y="222" width="290" height="2" rx="1" fill="#2a1a1a"/>

  <!-- Subtitle -->
  <text x="72" y="250" font-size="13.5" fill="#9ab0c8">400+ packages · 9 orgs · ~30 minutes</text>

  <!-- Tags -->
  <rect x="72" y="272" width="104" height="22" rx="11" fill="#1a0a0a" stroke="#ef4444" stroke-width="1"/>
  <text x="124" y="287" text-anchor="middle" font-size="10" fill="#ef4444">Shai-Hulud</text>

  <rect x="184" y="272" width="112" height="22" rx="11" fill="#051828" stroke="#10b981" stroke-width="1"/>
  <text x="240" y="287" text-anchor="middle" font-size="10" fill="#10b981">ignore-scripts</text>

  <!-- Branding -->
  <text x="72" y="388" font-size="11" fill="#1e3d56" letter-spacing="2.5">CYBERSECURITYOS.NET</text>

  <!-- Right: attack chain cards -->
  <rect x="476" y="60" width="256" height="72" rx="7" fill="#0d0a1a" stroke="#f59e0b" stroke-width="1"/>
  <rect x="476" y="60" width="4" height="72" fill="#f59e0b"/>
  <text x="490" y="79" font-size="8" fill="#f59e0b" letter-spacing="1" font-weight="700">STAGE 1 · SOURCE</text>
  <text x="490" y="97" font-size="12.5" fill="#f0f6ff" font-weight="600">Maintainer Account</text>
  <text x="490" y="117" font-size="9.5" fill="#5a7a8a">CI signed it. Valid provenance.</text>

  <rect x="476" y="142" width="256" height="72" rx="7" fill="#1a0505" stroke="#ef4444" stroke-width="1"/>
  <rect x="476" y="142" width="4" height="72" fill="#ef4444"/>
  <text x="490" y="161" font-size="8" fill="#ef4444" letter-spacing="1" font-weight="700">STAGE 2 · PREINSTALL</text>
  <text x="490" y="179" font-size="12.5" fill="#f0f6ff" font-weight="600">node setup.mjs</text>
  <text x="490" y="199" font-size="9.5" fill="#5a7a8a">Runs before your code does</text>

  <rect x="476" y="224" width="256" height="72" rx="7" fill="#0d0a1a" stroke="#8b5cf6" stroke-width="1"/>
  <rect x="476" y="224" width="4" height="72" fill="#8b5cf6"/>
  <text x="490" y="243" font-size="8" fill="#8b5cf6" letter-spacing="1" font-weight="700">STAGE 3 · PERSIST</text>
  <text x="490" y="261" font-size="12.5" fill="#f0f6ff" font-weight="600">.claude · .vscode hooks</text>
  <text x="490" y="281" font-size="9.5" fill="#5a7a8a">Survives node_modules wipe</text>

  <rect x="476" y="306" width="256" height="72" rx="7" fill="#1a0505" stroke="#ef4444" stroke-width="1.5"/>
  <rect x="476" y="306" width="4" height="72" fill="#ef4444"/>
  <text x="490" y="325" font-size="8" fill="#ef4444" letter-spacing="1" font-weight="700">⚠  DEAD-MAN SWITCH</text>
  <text x="490" y="343" font-size="12.5" fill="#fca5a5" font-weight="600">Isolate before revoke</text>
  <text x="490" y="363" font-size="9.5" fill="#8b5a5a">Rotation fires the payload</text>
</svg>
