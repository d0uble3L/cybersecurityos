<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" role="img" aria-labelledby="t d">
  <title id="t">ISC2 AI Security Academy</title>
  <desc id="d">Three levels of AI security learning: Foundations, Practitioner and Leader, each unlocking a badge.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050c1a"/>
      <stop offset="100%" stop-color="#0c1f3a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0e2440" stroke-width="0.7"/>
    </pattern>
  </defs>
  <rect width="800" height="420" fill="url(#bg)"/>
  <rect width="800" height="420" fill="url(#grid)"/>
  <rect x="0" y="0" width="800" height="4" fill="#00c9e0"/>
  <rect x="52" y="62" width="4" height="270" rx="2" fill="#00c9e0"/>

  <rect x="72" y="62" width="112" height="22" rx="11" fill="#061e38" stroke="#00c9e0" stroke-width="1"/>
  <text x="128" y="77" text-anchor="middle" font-size="9.5" fill="#00c9e0" letter-spacing="2" font-weight="600">AI SECURITY</text>
  <text x="194" y="77" font-size="9.5" fill="#3d6b8c" letter-spacing="1">NOV 17, 2026</text>

  <text x="72" y="140" font-size="34" font-weight="800" fill="#e8f4ff" letter-spacing="-1">ISC2 AI Security</text>
  <text x="72" y="180" font-size="34" font-weight="800" fill="#00c9e0" letter-spacing="-1">Academy</text>
  <rect x="72" y="198" width="280" height="2" rx="1" fill="#1a3a5a"/>
  <text x="72" y="226" font-size="14" fill="#9fb8d0">What it is and which path to pick</text>

  <g font-size="11" font-weight="600" letter-spacing="1.5">
    <rect x="72" y="256" width="120" height="28" rx="6" fill="#061e38" stroke="#1f5a7a"/>
    <text x="132" y="274" text-anchor="middle" fill="#9fdcea">FOUNDATIONS</text>
    <rect x="204" y="256" width="124" height="28" rx="6" fill="#061e38" stroke="#1f5a7a"/>
    <text x="266" y="274" text-anchor="middle" fill="#9fdcea">PRACTITIONER</text>
    <rect x="340" y="256" width="92" height="28" rx="6" fill="#061e38" stroke="#1f5a7a"/>
    <text x="386" y="274" text-anchor="middle" fill="#9fdcea">LEADER</text>
  </g>
  <text x="72" y="318" font-size="11" fill="#3d6b8c" letter-spacing="1">3 LEVELS · 3 BADGES · 11–16 CPE PER PATH</text>

  <!-- Stacked level mark -->
  <g transform="translate(620 210)">
    <path d="M0 -118 L82 -88 V-10 C82 50 44 86 0 104 C-44 86 -82 50 -82 -10 V-88 Z" fill="#061e38" stroke="#00c9e0" stroke-width="2.5"/>
    <rect x="-46" y="30" width="92" height="16" rx="3" fill="#00c9e0" opacity="0.35"/>
    <rect x="-46" y="4" width="92" height="16" rx="3" fill="#00c9e0" opacity="0.6"/>
    <rect x="-46" y="-22" width="92" height="16" rx="3" fill="#00c9e0" opacity="0.9"/>
    <text x="0" y="-48" text-anchor="middle" font-size="22" font-weight="800" fill="#e8f4ff" letter-spacing="2">AI</text>
  </g>
  <text x="748" y="396" text-anchor="end" font-size="11" fill="#3d6b8c" letter-spacing="2">CYBERSECURITYOS</text>
</svg>
