  <text x="490" y="241" font-size="8" fill="#10b981" letter-spacing="1" font-weight="700">LONG TAIL</text>
  <text x="490" y="261" font-size="12.5" fill="#fff0f2" font-weight="600">PHP ≤ 8.1: no fix coming</text>

  <rect x="476" y="280" width="256" height="48" rx="7" fill="#1a0409" stroke="#22d3ee" stroke-width="1"/>
  <rect x="476" y="280" width="4" height="48" fill="#22d3ee"/>
  <text x="490" y="297" font-size="8" fill="#22d3ee" letter-spacing="1" font-weight="700">DEFENDERS</text>
  <text x="490" y="317" font-size="12.5" fill="#fff0f2" font-weight="600">Patch, isolate, hunt</text>
