  <text x="234" y="71" font-size="9.5" fill="#5e3a44" letter-spacing="1">OCT 21, 2026</text>

  <!-- Title -->
  <text x="72" y="128" font-size="30" font-weight="800" fill="#f43f5e" letter-spacing="-0.5">PHP2Shell:</text>
  <text x="72" y="166" font-size="26" font-weight="800" fill="#fff0f2" letter-spacing="-0.5">Critical RCE in</text>
  <text x="72" y="204" font-size="26" font-weight="800" fill="#fff0f2" letter-spacing="-0.5">PHP Core</text>

  <!-- Divider -->
  <rect x="72" y="222" width="280" height="2" rx="1" fill="#2e0f18"/>

  <!-- Subtitle -->
  <text x="72" y="250" font-size="14" fill="#a07078">CVE-2026-109618 · CVE-2026-109619</text>

  <!-- Tags -->
  <rect x="72" y="272" width="62" height="22" rx="11" fill="#18040a" stroke="#f43f5e" stroke-width="1"/>
  <text x="103" y="287" text-anchor="middle" font-size="10" fill="#f43f5e">PHP</text>

  <rect x="142" y="272" width="62" height="22" rx="11" fill="#18040a" stroke="#f59e0b" stroke-width="1"/>
  <text x="173" y="287" text-anchor="middle" font-size="10" fill="#f59e0b">RCE</text>

  <rect x="212" y="272" width="140" height="22" rx="11" fill="#18040a" stroke="#22d3ee" stroke-width="1"/>
  <text x="282" y="287" text-anchor="middle" font-size="10" fill="#22d3ee">Incident Response</text>

  <!-- Branding -->
  <text x="72" y="388" font-size="11" fill="#2e0f18" letter-spacing="2.5">CYBERSECURITYOS.NET</text>

  <!-- Right: key facts -->
  <rect x="476" y="56" width="256" height="48" rx="7" fill="#1a0409" stroke="#f43f5e" stroke-width="1"/>
  <rect x="476" y="56" width="4" height="48" fill="#f43f5e"/>
  <text x="490" y="73" font-size="8" fill="#f43f5e" letter-spacing="1" font-weight="700">SEVERITY</text>
  <text x="490" y="93" font-size="12.5" fill="#fff0f2" font-weight="600">CVSS v4.0 9.2, both CVEs</text>

  <rect x="476" y="112" width="256" height="48" rx="7" fill="#1a0409" stroke="#f59e0b" stroke-width="1"/>
  <rect x="476" y="112" width="4" height="48" fill="#f59e0b"/>
  <text x="490" y="129" font-size="8" fill="#f59e0b" letter-spacing="1" font-weight="700">ACCESS</text>
  <text x="490" y="149" font-size="12.5" fill="#fff0f2" font-weight="600">Unauthenticated RCE</text>

  <rect x="476" y="168" width="256" height="48" rx="7" fill="#1a0409" stroke="#a855f7" stroke-width="1"/>
  <rect x="476" y="168" width="4" height="48" fill="#a855f7"/>
  <text x="490" y="185" font-size="8" fill="#a855f7" letter-spacing="1" font-weight="700">PATCH</text>
