<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" font-family="'Courier New', Courier, monospace" role="img" aria-labelledby="t d">
  <title id="t">CyberSHIELD Labs</title>
  <desc id="d">Nine hands-on defensive security labs: AI safety, cloud IAM, identity hunting, DLP, backups, SBOM, containers, passwords, and web exposure.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080d"/>
      <stop offset="60%" stop-color="#0a1219"/>
      <stop offset="100%" stop-color="#030608"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00ff88" stroke-opacity="0.05"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" stop-color="#00ff88" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00ff88" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="480" fill="url(#bg)"/>
  <rect width="900" height="480" fill="url(#grid)"/>
  <rect width="900" height="480" fill="url(#glow)"/>

  <!-- Shield mark -->
  <g transform="translate(450 112)">
    <path d="M0 -58 L48 -40 V4 C48 36 26 56 0 66 C-26 56 -48 36 -48 4 V-40 Z" fill="none" stroke="#00ff88" stroke-width="3"/>
    <path d="M-20 4 L-6 18 L22 -12" fill="none" stroke="#00ff88" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="450" y="232" text-anchor="middle" fill="#00ff88" font-size="13" letter-spacing="6" opacity="0.85">▸ HANDS-ON DEFENSIVE SECURITY · OPEN SOURCE</text>
  <text x="450" y="292" text-anchor="middle" fill="#ffffff" font-size="54" font-weight="bold" letter-spacing="10">CYBERSHIELD LABS</text>
  <text x="450" y="328" text-anchor="middle" fill="#9aa59a" font-size="16" letter-spacing="2">9 labs · 0 dependencies · 100% local &amp; synthetic</text>

  <!-- Lab chips -->
  <g font-size="12" letter-spacing="2" text-anchor="middle">
    <g transform="translate(0 372)">
      <rect x="62" y="0" width="140" height="30" fill="#0d1117" stroke="#00ff88" stroke-opacity="0.35"/><text x="132" y="20" fill="#00ff88">AI SAFETY</text>
      <rect x="216" y="0" width="140" height="30" fill="#0d1117" stroke="#00ff88" stroke-opacity="0.35"/><text x="286" y="20" fill="#00ff88">CLOUD IAM</text>
      <rect x="370" y="0" width="160" height="30" fill="#0d1117" stroke="#00ff88" stroke-opacity="0.35"/><text x="450" y="20" fill="#00ff88">IDENTITY HUNT</text>
      <rect x="544" y="0" width="140" height="30" fill="#0d1117" stroke="#00ff88" stroke-opacity="0.35"/><text x="614" y="20" fill="#00ff88">DLP</text>
      <rect x="698" y="0" width="140" height="30" fill="#0d1117" stroke="#00ff88" stroke-opacity="0.35"/><text x="768" y="20" fill="#00ff88">BACKUPS</text>
    </g>
    <g transform="translate(0 414)">
      <rect x="139" y="0" width="140" height="30" fill="#0d1117" stroke="#00ff88" stroke-opacity="0.35"/><text x="209" y="20" fill="#00ff88">SBOM</text>
      <rect x="293" y="0" width="140" height="30" fill="#0d1117" stroke="#00ff88" stroke-opacity="0.35"/><text x="363" y="20" fill="#00ff88">CONTAINERS</text>
      <rect x="447" y="0" width="140" height="30" fill="#0d1117" stroke="#00ff88" stroke-opacity="0.35"/><text x="517" y="20" fill="#00ff88">PASSWORDS</text>
      <rect x="601" y="0" width="160" height="30" fill="#0d1117" stroke="#00ff88" stroke-opacity="0.35"/><text x="681" y="20" fill="#00ff88">WEB EXPOSURE</text>
    </g>
  </g>
</svg>
