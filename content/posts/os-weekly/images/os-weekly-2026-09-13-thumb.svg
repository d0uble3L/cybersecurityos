<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050c1a"/>
      <stop offset="100%" stop-color="#0c1f3a"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#0e2440" stroke-width="0.7"/>
    </pattern>
  </defs>

  <rect width="800" height="420" fill="url(#bg)"/>
  <rect width="800" height="420" fill="url(#grid)"/>

  <!-- Top accent -->
  <rect x="0" y="0" width="800" height="4" fill="#00c9e0"/>

  <!-- Left bar -->
  <rect x="52" y="56" width="4" height="254" rx="2" fill="#00c9e0"/>

  <!-- OS-WEEKLY chip -->
  <rect x="72" y="56" width="106" height="22" rx="11" fill="#061e38" stroke="#00c9e0" stroke-width="1"/>
  <text x="125" y="71" text-anchor="middle" font-size="9.5" fill="#00c9e0" letter-spacing="2" font-weight="600">OS-WEEKLY</text>
  <text x="188" y="71" font-size="9.5" fill="#3d6b8c" letter-spacing="1">SEP 13, 2026</text>

  <!-- Title -->
  <text x="72" y="128" font-size="22" font-weight="800" fill="#e8f4ff" letter-spacing="-0.5">A Chrome Zero-Day,</text>
  <text x="72" y="164" font-size="22" font-weight="800" fill="#e8f4ff" letter-spacing="-0.5">the Biggest Patch Tuesday</text>
  <text x="72" y="200" font-size="22" font-weight="800" fill="#00c9e0" letter-spacing="-0.5">Yet &amp; Museum Heists</text>

  <!-- Divider -->
  <rect x="72" y="222" width="280" height="2" rx="1" fill="#1a3a5a"/>

  <!-- Subtitle -->
  <text x="72" y="250" font-size="14" fill="#7aaece">974 CVEs, one V8 bug, hard lessons.</text>

  <!-- Tags -->
  <rect x="72" y="272" width="98" height="22" rx="11" fill="#051828" stroke="#ef4444" stroke-width="1"/>
  <text x="121" y="287" text-anchor="middle" font-size="10" fill="#ef4444">Zero-Day</text>

  <rect x="180" y="272" width="118" height="22" rx="11" fill="#051828" stroke="#f59e0b" stroke-width="1"/>
  <text x="239" y="287" text-anchor="middle" font-size="10" fill="#f59e0b">Patch Tuesday</text>

  <rect x="308" y="272" width="108" height="22" rx="11" fill="#051828" stroke="#a855f7" stroke-width="1"/>
  <text x="362" y="287" text-anchor="middle" font-size="10" fill="#a855f7">Perspective</text>

  <!-- Branding -->
  <text x="72" y="388" font-size="11" fill="#1e3d56" letter-spacing="2.5">CYBERSECURITYOS.NET</text>

  <!-- Right: story cards -->
  <rect x="476" y="88" width="256" height="80" rx="7" fill="#071528" stroke="#ef4444" stroke-width="1"/>
  <rect x="476" y="88" width="4" height="80" fill="#ef4444"/>
  <text x="490" y="109" font-size="8" fill="#ef4444" letter-spacing="1" font-weight="700">ZERO-DAY · BROWSER</text>
  <text x="490" y="129" font-size="12.5" fill="#f0f6ff" font-weight="600">Chrome V8 Engine</text>
  <text x="490" y="150" font-size="9.5" fill="#5a8aa8">CVE-2026-87491, active</text>

  <rect x="476" y="184" width="256" height="80" rx="7" fill="#071528" stroke="#f59e0b" stroke-width="1"/>
  <rect x="476" y="184" width="4" height="80" fill="#f59e0b"/>
  <text x="490" y="205" font-size="8" fill="#f59e0b" letter-spacing="1" font-weight="700">PATCH TUESDAY · RECORD</text>
  <text x="490" y="225" font-size="12.5" fill="#f0f6ff" font-weight="600">974 Vulnerabilities</text>
  <text x="490" y="246" font-size="9.5" fill="#5a8aa8">113 critical, 2 exploited</text>

  <rect x="476" y="280" width="256" height="80" rx="7" fill="#071528" stroke="#a855f7" stroke-width="1"/>
  <rect x="476" y="280" width="4" height="80" fill="#a855f7"/>
  <text x="490" y="301" font-size="8" fill="#a855f7" letter-spacing="1" font-weight="700">PERSPECTIVE</text>
  <text x="490" y="321" font-size="12.5" fill="#f0f6ff" font-weight="600">Museum Heists</text>
  <text x="490" y="342" font-size="9.5" fill="#5a8aa8">Defense in depth, explained</text>
</svg>
