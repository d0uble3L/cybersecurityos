baseURL = "https://www.cybersecurityos.net"
languageCode = "en-us"
title = "CybersecurityOS"
theme = "ananke"
enableGitInfo = true

# SEO Metadata
description = "Weekly security intelligence, mental models, and leadership frameworks for security engineers, CISOs, and the next generation of cyber leaders — written by a practicing Deputy CISO."
keywords = "cybersecurity, security leadership, CISO frameworks, security engineering, threat intelligence, AI security, DevSecOps, mental models, cyber risk management"
author = "Michael Tayo"
# To enable Google Analytics add your tracking ID:
# [services.googleAnalytics]
#   id = "G-XXXXXXXXXX"

# Taxonomies: add social taxonomy to address deprecation of .Site.Social
[taxonomies]
  tag = "tags"
  category = "categories"
  social = "social"

# Params (Optional: Adjust as needed based on your theme)
[params]
  env = "production"
  favicon = "favicon.ico"   # Full icon set is in static/ and layouts/partials/site-favicon.html
  site_logo = "images/c-os.svg"
  showSocialLinks = true        # Show social links in the footer (if supported by the theme)
  paginate = 20
  rss = "/index.xml" #rss
  show_reading_time = true

# Homepage telemetry panel (layouts/partials/func/GetHomeStats.html).
# Live numbers are fetched from these feeds on every build; the deploy
# workflow rebuilds daily so they stay current.
[params.stats]
  nvdURL = "https://services.nvd.nist.gov/rest/json/cves/2.0"
  kevURL = "https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json"
  windowDays = 30          # CVE / KEV trend window
  vendorWindowDays = 90    # "Most-Exploited Vendor" window
  weeklyCategory = "OS Weekly"
  focusExclude = ["OS Weekly"]   # categories that are formats, not topics

# Shown only if a feed is unreachable at build time
[params.stats.fallback]
  cvesPerDay = 131   # 2025 NVD daily average

[params.social]
  linkedin = "https://www.linkedin.com/company/cybersecurityos/" #linkedin
  twitter = 'cybersecurityos'

# Footer social icons (read by the Ananke theme's socials partials)
[[params.ananke_socials]]
  name = "twitter"
  label = "X"
  url = "https://x.com/cybersecurityos"

[[params.ananke_socials]]
  name = "instagram"
  url = "https://www.instagram.com/cybersecurityos/"

[[params.ananke_socials]]
  name = "linkedin"
  url = "https://www.linkedin.com/company/cybersecurityos/"
  
# Menu Configuration (Optional: Customize navigation)
[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 1

[[menu.main]]
  name = "Posts"
  url = "/posts/"
  weight = 2

[[menu.main]]
  name = "Docs"
  url = "/docs/"
  weight = 3


 [[menu.main]]
  name = "Search"
  url = "/search/"
  weight = 4

[[menu.main]]
  name = "Contact"
  url = "/contact/"
  weight = 5

[[menu.main]]
  name = "Membership"
  url = "https://cybersecurityos.gumroad.com/l/os-member"
  weight = 6

# Image processing pipeline (WebP conversion, quality, EXIF stripping)
[imaging]
  quality = 85
  resampleFilter = "Lanczos"

[imaging.exif]
  includeFields = ""
  excludeFields = ".*"
  disableDate = true
  disableLatLong = true

# Remote feeds (homepage stats) are cached for at most a few hours locally
[caches.getresource]
  maxAge = "6h"

# Sitemap
[sitemap]
  changefreq = "weekly"
  filename   = "sitemap.xml"
  priority   = 0.5

[services]
  [services.disqus]
    shortname = 'https-www-cybersecurityos-net'